[project]
name = "barnes"
version = "0.1.0"
description = "Quantificação do aprendizado espacial no labirinto de Barnes"
readme = "README.md"
requires-python = ">=3.11,<3.12"

# Licenças: apenas BSD / MIT / Apache-2.0 no bloco principal.
# A auditoria de US-30 exige nenhuma dependência GPL/AGPL na distribuição.
# Por isso este projeto NÃO usa pingouin (GPL-3) nem ultralytics (AGPL).
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "opencv-python>=4.9",       # vídeo e janelas de ajuste do MVP
    "shapely>=2.0",             # geometria dos buracos
    "pyarrow>=15.0",            # trajetoria.parquet
    "duckdb>=0.10",             # consulta analítica sobre o Parquet
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "scikit-learn>=1.4",        # kappa de Cohen (US-21)
    "statsmodels>=0.14",        # diagnósticos complementares
    "pyyaml>=6.0",              # configs/*.yaml
    "psycopg[binary]>=3.1",     # PostgreSQL — via de distribuição definida em US-27
    "typer>=0.12",              # CLI
    "python-dotenv>=1.0",       # .env local com BARNES_DATABASE_URL (US-27) — BSD-3
]

[project.optional-dependencies]
# US-07/08: backend SLEAP-NN (PyTorch), sem a GUI e sem TensorFlow.
# Ambiente CUDA 12.8 fixado abaixo; instruções em docs/pose-treino-avaliacao.md.
# Instalar apenas na máquina escolhida; o núcleo e os testes não exigem GPU.
pose = [
    "sleap-nn==0.3.1",
    "sleap-io==0.9.2",
    "torch==2.7.1",
    "torchvision==0.22.1",
]

# Leitura do projeto de anotação do SLEAP (.slp) — US-06, `barnes pose import-slp`.
# sleap-io é BSD-3 e só lê/grava arquivos: não traz TensorFlow/PyTorch nem
# CUDA, então pode ser instalado já, sem esperar a decisão de `pose` acima.
anotacao = [
    "sleap-io==0.9.2",
]

# Similaridade de trajetórias (US-24) — contribuição protegida.
longitudinal = [
    "dtaidistance>=2.3",
    "similaritymeasures>=1.1",
]

# Interface gráfica — não está nos 30 cards.
# Plano pronto para acionar em PLUGIN-INTERFACE-GRAFICA.md, se D1 exigir.
# PySide6 é LGPL: reavaliar contra o critério de licenças de US-30 antes de adotar.
gui = [
    "PySide6>=6.6",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[project.scripts]
barnes = "barnes.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/barnes"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# tests/io/test_calibration.py e tests/db/test_calibration.py (US-02) têm o
# mesmo nome de módulo em diretórios sem __init__.py; importlib resolve pelo
# caminho do arquivo em vez de inserir tudo num namespace de módulos só.
addopts = "--import-mode=importlib"

[tool.ruff]
line-length = 100
target-version = "py311"

# Windows/Linux: build NVIDIA explícito; não depende de CUDA instalado à parte.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", extra = "pose", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cu128", extra = "pose", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]

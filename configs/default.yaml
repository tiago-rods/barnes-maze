# Limiares operacionais padrão
#
# ATENÇÃO — DECISÕES DA EQUIPE, SEM G3.
#
# O plano era preencher estes limiares só depois de `docs/definicoes-metricas.md`
# assinado pelo laboratório (G3, marco M1), a partir de anotação manual. O
# contato com o LNBio não ocorreu. Em 12/11/2026 a equipe aprovou valores
# próprios, registrados com a justificativa de cada um em
# `docs/decisoes-sem-laboratorio.md` (opção b da seção 16). Eles NÃO são o
# acordo do laboratório nem foram calibrados contra anotação: são convenções
# da equipe, rastreáveis em toda execução por `versao_definicoes` (copiada em
# `execucao.limiares`). Se o laboratório responder, cada valor é revisto contra
# a resposta — nunca o contrário.
#
# A pergunta de origem está ao lado de cada chave. `null` aqui é intencional.

versao_definicoes: decisoes-equipe-2026-11-12-sem-G3   # docs/decisoes-sem-laboratorio.md

# --- Evento: encontrar (US-11, US-12) -----------------------------------------
# PROVISÓRIO, por falta de resposta do laboratório em G3 (C1) — não é o valor
# acordado da seção 1. É uma faixa comum de rastreamento comportamental de
# roedores (ex. zonas de "nose-point"/orientação de cabeça do EthoVision),
# sem citação verificada. `calibrado_contra_anotacao` continua false de
# propósito: nunca marcar este valor como aceito. Troque pelos dois números
# que o laboratório decidir, e só então vire `calibrado_contra_anotacao` via
# US-12. Ver docs/definicoes-metricas.md, seção 1 (linhas 1-2).
encontrar:
  distancia_cm: 3              # C1 — distância focinho↔buraco — PROVISÓRIO
  angulo_graus: 30             # C1 — desvio máximo da orientação da cabeça — PROVISÓRIO
  calibrado_contra_anotacao: false   # US-12: vira true após a calibração

# --- Evento: entrar / checar fisicamente (US-13) ------------------------------
# Decisão da equipe (C2, sem G3): docs/decisoes-sem-laboratorio.md, seção 7.
entrar:
  focinho_dentro: true        # C2 — critério: focinho dentro do perímetro do buraco
  raio_fator: 1.0             # C2 — raio da área = raio físico calibrado * fator; 1.0 = o próprio buraco
  duracao_minima_s: 0.2       # C2 — 5 quadros a 25 fps: filtra ruído de um quadro isolado

# --- Evento: dwell (US-14) ----------------------------------------------------
# RN02: o critério de permanência (região e continuidade) é o mesmo já usado
# para "entrar" acima (entrar.raio_fator/focinho_dentro) — dwell não introduz
# um novo critério espacial, só mede a duração do segmento de E. O dwell é
# medido para todo evento de entrada, sem filtro por duração (Cenário 1 do
# US-14): esta chave não é lida nem usada por barnes.events.entry; nenhum dwell
# é descartado por ela. Fica null por decisão (decisoes-sem-laboratorio.md §7).
dwell:
  duracao_minima_s: null      # C2 — null intencional; não consumido pelo cálculo de dwell

# --- Erro (US-17) -------------------------------------------------------------
# O que conta como erro (pergunta C3, linhas 6-7 de docs/definicoes-metricas.md)
# é decisão da equipe, sem G3: docs/decisoes-sem-laboratorio.md, seção 8. Com
# `criterio` null, barnes.metrics.errors.load_error_definition RECUSA a
# configuração (total_errors/primary_errors não são contados).
# O erro é derivado só da sequência de visitação (US-15), nunca da trajetória:
# trocar estes valores recalcula sem reprocessar vídeo nem trajetória (RN05).
#   qualquer_buraco_incorreto: toda checagem de buraco que não é o alvo conta;
#                              duracao_minima_s deve ficar null.
#   acima_de_duracao:          só conta checagem incorreta com
#                              dwell >= duracao_minima_s (inclusivo, US-14).
erro:
  criterio: qualquer_buraco_incorreto   # C3 — "qualquer_buraco_incorreto" | "acima_de_duracao"
  duracao_minima_s: null      # C3 — segundos (> 0); só se criterio == "acima_de_duracao"

# --- Estratégia de busca (US-20) ----------------------------------------------
# Regra explícita e calibrável, não modelo treinado (seção 4 da definição).
# Decisão da equipe (C4, sem G3): categorias de Harrison et al. (2006),
# docs/decisoes-sem-laboratorio.md, seção 10. A semântica exata das chaves é
# da US-20, ainda não implementada: revisar estes valores junto com ela.
estrategia:
  cruzamentos_centro_min: 1         # C4 — um cruzamento do centro antes do alvo descaracteriza "espacial"
  adjacencia_angular_graus: 18      # C4 — um buraco de distância = 360/N; 18 com 20 buracos (revisar se N != 20)
  erros_ate_alvo_max: 3             # C4 — erros admitidos antes do alvo na busca espacial
  entropia_max_espacial: null       # C4 — fora da regra de Harrison; null intencional

# --- Trial (US-03, US-16) -----------------------------------------------------
trial:
  tempo_limite_s: 180         # B5 — decisão da equipe (decisoes-sem-laboratorio.md §6);
                              # define a censura (primary_event/total_event, US-16)
  recorte_inicio_s: null      # US-03 — null = detecção automática da soltura
  recorte_fim_s: null

# --- Qualidade de pose (US-10) ------------------------------------------------
# Como `anotacao:` abaixo, NÃO são limiares de métrica do G3: são parâmetros de
# tratamento da pose, decisão da equipe registrada em docs/revisao-cards.md
# (US-10) e em docs/contrato-trajetoria.md. Valores propostos pelo grupo.
pose:
  cobertura_minima: 0.98      # critério de aceite da seção 10 — proposto pelo grupo
  # Lacuna curta: até este número de quadros seguidos sem um ponto, entre dois
  # quadros com o ponto. É interpolada. Lacuna longa: qualquer uma maior, ou
  # qualquer uma na borda do intervalo útil. É sinalizada para revisão humana.
  lacuna_curta_max_quadros: 5       # 0,2 s a 25 fps — proposto pelo grupo
  suavizacao:
    metodo: mediana           # mediana móvel: robusta a um quadro isolado errado
    janela_quadros: 5         # ímpar; 1 = sem suavização — proposto pelo grupo

# --- Anotação de pose (US-06) -------------------------------------------------
# Diferente das seções acima, NÃO são limiares de métrica do G3: são parâmetros
# do protocolo de anotação, decisão da equipe registrada em
# docs/protocolo-anotacao.md. Definem só quais quadros são sorteados para
# anotar e como a contagem por região é reportada (e, em US-08, em que região
# o erro do modelo é medido). Valores propostos pelo grupo.
anotacao:
  regioes:
    centro_raio_frac: 0.5       # até esta fração do raio da circunferência dos buracos = "centro"
    buraco_margem_raios: 1.0    # margem além do buraco, em raios de buraco = "proximidade de buraco"
  quadros_por_regiao:           # meta por trial; ~100 por trial × 3 trials de G1 ≈ 300 quadros
    centro: 30
    borda: 30
    buraco: 40
  intervalo_minimo_quadros: 25  # 1 s a 25 fps entre quadros sorteados do mesmo trial
  divisao:                      # proporção de TRIALS, nunca de quadros (RN03)
    treino: 0.7
    validacao: 0.15
    teste: 0.15
  semente: 0                    # mesma semente = mesma amostragem e mesma divisão
